[package]
name = "rust-loc"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "Count Rust source lines with test code excluded, plus ULOC, complexity and unsafe metrics."
license = "MIT"
keywords = ["rust", "loc", "cloc", "tokei", "scc", "lines-of-code"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["python/", "docs/"]

[lib]
name = "rust_loc"
path = "src/lib.rs"

[[bin]]
name = "rust-loc"
path = "src/main.rs"

[[bin]]
name = "rust-loc-gui"
path = "src/bin/rust-loc-gui.rs"

# Raw Win32 bindings for the native front end, generated by Microsoft from the
# Windows SDK metadata (the windows-rs project). Feature gated to exactly the
# API surface the GUI touches so the crate stays tiny and fast to build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

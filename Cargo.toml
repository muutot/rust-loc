[package]
name = "rust-loc"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "Count Rust, Python, Go, Java and 28 more source languages' lines with test code excluded, plus ULOC, complexity and unsafe metrics."
license = "MIT"
keywords = ["rust", "python", "loc", "cloc", "tokei", "lines-of-code", "go", "java", "typescript"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["python/", "docs/"]

[lib]
name = "rust_loc"
path = "src/lib.rs"

[[bin]]
name = "rust-loc"
path = "src/main.rs"

# The web front end is the default product: `cargo build` produces it. It
# needs the `web` feature (on by default) for its server dependencies.
[[bin]]
name = "rust-loc-web"
path = "src/bin/rust-loc-web.rs"
required-features = ["web"]

# The native Win32 front end stays available behind `--features gui` but is
# no longer part of the default build.
[[bin]]
name = "rust-loc-gui"
path = "src/bin/rust-loc-gui.rs"
required-features = ["gui"]

[[bin]]
name = "rust-loc-mcp"
path = "src/bin/rust-loc-mcp.rs"

[[example]]
name = "probe"
path = "examples/probe.rs"

[features]
default = ["web"]
# The local web server: axum + tokio drive it, serde carries the API payload.
web = [
    "dep:axum",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:serde",
    "dep:serde_json",
]
# The native Win32 shell, kept out of the default build while the web front
# end takes over.
gui = []

# Raw Win32 bindings for the native front end, generated by Microsoft from the
# Windows SDK metadata (the windows-rs project). Feature gated to exactly the
# API surface the GUI touches so the crate stays tiny and fast to build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dependencies]
axum = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", optional = true, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

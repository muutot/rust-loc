name: ci

# Every push and pull request: the test suite on Windows, the platform the
# tool is developed and shipped for.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web page
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test
        run: cargo test --locked

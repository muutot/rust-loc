name: debug
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe env
        shell: pwsh
        run: |
          python -c "import ctypes; buf=ctypes.create_unicode_buffer(300); ctypes.windll.kernel32.GetTempPathW(300,buf); print(repr(buf.value))"
          git --version
          git config --global --list
          echo "TEMP=$env:TEMP"

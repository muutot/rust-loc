name: release

# Build the release binaries on every version tag and attach the exes to the
# GitHub Release the tag points at. The web page is built first and embedded
# by build.rs, so the binaries ship the real UI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web page
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test
        run: cargo test --release --locked

      - name: Build release binaries
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }} --no-default-features

      - name: Attach the exes to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/rust-loc.exe
            target/${{ matrix.target }}/release/rust-loc-web.exe
            target/${{ matrix.target }}/release/rust-loc-mcp.exe

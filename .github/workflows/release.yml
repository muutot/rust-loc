name: release

# Build the release binaries on every version tag and attach them to the
# GitHub Release the tag points at. The web page is built first and embedded
# by build.rs, so the binaries ship the real UI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: rust-loc-windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web page
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test
        run: cargo test --release --locked

      - name: Build release binaries
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }} --no-default-features

      - name: Stage artifacts
        shell: pwsh
        run: |
          $stage = "stage/${{ matrix.name }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          $t = "${{ matrix.target }}"
          foreach ($bin in @("rust-loc", "rust-loc-web", "rust-loc-mcp")) {
            Copy-Item "target/$t/release/$bin.exe" "$stage/$bin.exe"
          }
          # A no-default-features CLI without the web server, for CI boxes.
          New-Item -ItemType Directory -Force "stage/${{ matrix.name }}-cli" | Out-Null
          Copy-Item "target/$t/release/rust-loc.exe" "stage/${{ matrix.name }}-cli/rust-loc.exe"
          foreach ($dir in @("stage/${{ matrix.name }}", "stage/${{ matrix.name }}-cli")) {
            Copy-Item README.md $dir/
          }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "stage/${{ matrix.name }}/*" -DestinationPath "${{ matrix.name }}.zip"
          Compress-Archive -Path "stage/${{ matrix.name }}-cli/*" -DestinationPath "${{ matrix.name }}-cli.zip"
          Get-ChildItem *.zip | Select-Object Name, Length

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}-cli.zip
